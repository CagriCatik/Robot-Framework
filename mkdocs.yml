site_name: Robot Framework Guide
site_url: https://cagricatik.github.io/Robot-Framework/
repo_url: https://github.com/CagriCatik/Robot-Framework
repo_name: CagriCatik/Robot-Framework
edit_uri: edit/main/docs/
site_description: Comprehensive guide to Robot Framework automation, from installation to best practices.
docs_dir: docs

theme:
  name: material
  language: en
  # logo: assets/robot-logo.svg
  # favicon: assets/robot-logo.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.3/dist/mermaid.min.js
  - javascripts/extra.js

nav:
  - Home: index.md
  - Introduction:
      - Overview: 01_overview.md
      - About: 02_about.md
  - Getting Started:
      - Installation: 03_installation.md
      - Configuration: 04_configuration.md
  - Core Concepts:
      - Project Structure: 05_robot-project.md
      - Settings Section: 06_settings_section.md
      - Test Suites & Cases: 07_test_suites_and_cases.md
  - Execution & Variables:
      - Execution & Logging: 08_execution_and_logging.md
      - Variables Deep Dive: 09_variables_deep_dive.md
  - Advanced Automation:
      - User Keywords: 10_user_keywords.md
      - Resource Files: 11_resource_files.md
  - Best Practices & Help:
      - Best Practices: 12_best_practices.md
      - Troubleshooting: 13_troubleshooting.md